name: Quality checks

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); console.log('Production dependency vulnerabilities:', JSON.stringify(a.metadata?.vulnerabilities ?? {})); console.log(JSON.stringify(Object.entries(a.vulnerabilities ?? {}).map(([name, v]) => ({name, severity:v.severity, range:v.range, fixAvailable:v.fixAvailable})), null, 2))"
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --passWithNoTests
      - name: Production build
        run: npm run build
